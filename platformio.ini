; ===============================================================
; Station Meteo ESP32-S3
; ---------------------------------------------------------------
; Deux environnements disponibles :
;   pio run -e esp32-s3      -t upload   → flash via USB (defaut)
;   pio run -e esp32-s3-ota  -t upload   → flash via WiFi (OTA)
;
; Note : la 1ere fois il FAUT flasher en USB ; ensuite l'OTA marche.
; ===============================================================

[common]
platform  = espressif32
board     = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

lib_deps =
    adafruit/DHT sensor library
    adafruit/Adafruit Unified Sensor
    https://github.com/me-no-dev/AsyncTCP.git
    https://github.com/me-no-dev/ESPAsyncWebServer.git
    arduino-libraries/NTPClient
    bodmer/TFT_eSPI
    knolleary/PubSubClient
    ncmreynolds/ld2410

build_flags =
    -DUSER_SETUP_LOADED
    -include include/User_Setup.h

; --- Flash via USB (par defaut) ----------------------------------
[env:esp32-s3]
platform      = ${common.platform}
board         = ${common.board}
framework     = ${common.framework}
lib_deps      = ${common.lib_deps}
build_flags   = ${common.build_flags}
monitor_speed = ${common.monitor_speed}

; --- Flash via OTA WiFi ------------------------------------------
[env:esp32-s3-ota]
platform        = ${common.platform}
board           = ${common.board}
framework       = ${common.framework}
lib_deps        = ${common.lib_deps}
build_flags     = ${common.build_flags}
monitor_speed   = ${common.monitor_speed}
upload_protocol = espota
upload_port     = station-meteo.local
upload_flags    =
    --auth=esp32station
    --port=3232
